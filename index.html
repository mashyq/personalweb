<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Everything between the markers is regenerated at build time by
      scripts/prerender.mjs from src/lib/seo.js (title, description,
      canonical, Open Graph, Twitter cards, JSON-LD, verification tags).
      Edit src/lib/seo.js, not this block.
    -->
    <!--@seo-->
    <title>FrankTech — ICT Support, Networking &amp; Security Solutions</title>
    <meta
      name="description"
      content="FrankTech delivers professional ICT support, networking, CCTV installation, PC repair and IT consultation in Nairobi. Calm, clear and dependable tech help."
    />
    <meta name="robots" content="index, follow" />
    <!--/@seo-->

    <meta name="theme-color" content="#0d0b14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    />
    <!-- Loaded asynchronously so the stylesheet never blocks first paint. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      />
    </noscript>

    <script>
      // Runs before first paint. Applies the stored theme without flashing the
      // wrong colours, and marks the document as JS-capable so scroll-reveal
      // animations only hide content when we can animate it back in.
      (function () {
        var root = document.documentElement;
        root.classList.add("js");
        try {
          var stored = localStorage.getItem("franktech-theme");
          if (stored === "dark" || (!stored && matchMedia("(prefers-color-scheme: dark)").matches)) {
            root.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
